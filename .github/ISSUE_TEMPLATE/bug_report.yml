name: Bug report
description: Report broken behavior, regressions, crashes, or reliability issues.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        Feature requests belong in the **Feature request** form.
        Search existing issues first and keep the report focused on one problem.

        Do not paste prompts, responses, credentials, or `COMPUTE.md` contents. Redact hostnames and paths if they are sensitive.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included enough detail to reproduce or investigate the problem.
          required: true
        - label: I redacted secrets, credentials, and private host details from everything below.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - apps/server (HTTP server, SQLite, refresh)
        - apps/web (dashboard, charts, filters, settings)
        - apps/vscode-extension
        - apps/source-host-agent / remote hosts over SSH
        - Importer — Codex
        - Importer — Claude Code
        - Importer — Grok Build
        - Importer — OpenCode
        - Pricing or cost estimate
        - Plan limits / credential attribution
        - packages/contracts or packages/dashboard-actions
        - Build, CI, or release tooling
        - Docs
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options:
        - Standalone (`bun run standalone` / CLI)
        - VS Code extension
        - Dev (`bun run dev`)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Start the server with ...
        2. Open the dashboard and select the 7-day filter
        3. Refresh
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The Claude Code plan meter should show the cached utilization block.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The meter is empty and the source is reported as unavailable.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Wrong numbers (cost, tokens, or limits are incorrect)
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, commit SHA, or branch name if known.
      placeholder: main @ abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node/Bun version, browser, VS Code version, and harness versions if relevant.
      placeholder: Debian 13, Node 24.x, Bun 1.3.x, Firefox 140, Codex CLI 0.x, Claude Code 2.x

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste the most relevant output only. Redact secrets and private host details.
      render: shell

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
